<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0c0a09; color: #fff; font-family: sans-serif; padding: 20px; }
.row { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
.card { background: #1c1917; padding: 15px; border-radius: 12px; border: 1px solid #333; }
img { max-height: 350px; display: block; }
.blend-darken { mix-blend-mode: multiply; }
.blend-screen { mix-blend-mode: screen; }
</style>
</head>
<body>
<h2>Original Images vs Transparent</h2>
<div class="row">
  <div class="card">
    <h4>Original Logo</h4>
    <img src="/popcorn-logo.png" />
  </div>
  <div class="card">
    <h4>Transparent Logo (Extracted)</h4>
    <img src="/popcorn-logo-transparent.png" />
  </div>
  <div class="card">
    <h4>Character Original</h4>
    <img src="/popcorn-character.png" />
  </div>
</div>
</body>
</html>
